spring.config.import=optional:file:./.env[.properties]
spring.application.name=scamshield-backend
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true

app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration-ms=3600000
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.gemini.timeout=${GEMINI_TIMEOUT:20s}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
app.url-scanner.google-safe-browsing-api-key=${GOOGLE_SAFE_BROWSING_API_KEY:}
app.jobs.adzuna.app-id=${ADZUNA_APP_ID:}
app.jobs.adzuna.app-key=${ADZUNA_APP_KEY:}
app.jobs.adzuna.country=${ADZUNA_COUNTRY:gb}
app.job-matching.weight.skills=${JOB_MATCH_WEIGHT_SKILLS:50}
app.job-matching.weight.experience=${JOB_MATCH_WEIGHT_EXPERIENCE:20}
app.job-matching.weight.education=${JOB_MATCH_WEIGHT_EDUCATION:10}
app.job-matching.weight.location-mode=${JOB_MATCH_WEIGHT_LOCATION_MODE:10}
app.job-matching.weight.job-type=${JOB_MATCH_WEIGHT_JOB_TYPE:10}
app.scam-detector.max-file-size=5MB
app.resume.max-file-size=${RESUME_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-file-size=${app.resume.max-file-size}
spring.servlet.multipart.max-request-size=${RESUME_MAX_REQUEST_SIZE:6MB}

server.error.include-message=never
